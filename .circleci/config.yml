version: 2.1
orbs:
  clever: clever/circleci-orbs@dev:87718b641442a95fd41ff68a7654e768e25d1143

workflows:
  build_test_publish:
    jobs:
      - clever/go_test:
          context:
            - github-app-auth
      - clever/go_lint:
          context:
            - github-app-auth
      - clever/publish_utility:
          requires:
            - clever/go_test
            - clever/go_lint
          filters:
            branches:
              only: infra-419
          context:
            - aws-lambda-private
            - aws-ecr-private
            - github-app-auth
